<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Player</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: black; color: white; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        .hidden { display: none !important; }
        
        /* Pairing Screen */
        #setup { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: #0f172a; }
        input { font-size: 3rem; text-align: center; width: 350px; padding: 15px; margin: 30px 0; text-transform: uppercase; letter-spacing: 10px; background: #1e293b; border: 2px solid #334155; color: white; border-radius: 12px; outline: none; transition: 0.3s; }
        input:focus { border-color: #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
        button { padding: 15px 50px; font-size: 1.2rem; cursor: pointer; background: #3b82f6; color: white; border: none; border-radius: 50px; font-weight: bold; transition: 0.2s; }
        button:hover { background: #2563eb; transform: scale(1.05); }

        /* Player Screen */
        #player { position: relative; width: 100vw; height: 100vh; }
        .slide { position: absolute; top:0; left:0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 1s; background: black; }
        .active { opacity: 1; }
        
        #status-bar { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 20px; color: rgba(255,255,255,0.8); font-size: 0.8rem; z-index: 100; backdrop-filter: blur(4px); }
    </style>
</head>
<body>

    <div id="setup">
        <h1 style="color:#94a3b8; margin:0; letter-spacing:2px; font-weight:400">ENTER PAIRING CODE</h1>
        <input id="code" maxlength="6" placeholder="------">
        <button onclick="pair()">CONNECT DEVICE</button>
    </div>

    <div id="player" class="hidden">
        <div id="stage"></div>
        <div id="status-bar">Connecting...</div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // ⚠️ PASTE YOUR KEYS HERE ⚠️
        const YOUR_SUPABASE_URL = 'https://kbmnkxfosrowmqedykur.supabase.co'; 
        const YOUR_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtibW5reGZvc3Jvd21xZWR5a3VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgyMTIxNTEsImV4cCI6MjA4Mzc4ODE1MX0.l9av5SrgoknXOJZwbmRjLXcB9SYuelivUA4GSv9gsl4'; // <-- PASTE YOUR LONG KEY HERE

        const sb = supabase.createClient(YOUR_SUPABASE_URL, YOUR_SUPABASE_KEY);

        let myCode = localStorage.getItem('pair_code');
        let cache = {}; 
        let loopRunning = false;

        // Auto-start if paired before
        if (myCode) {
            document.getElementById('code').value = myCode;
            pair(true); // true = silent mode
        }

        async function pair(silent = false) {
            const input = document.getElementById('code').value.toUpperCase();
            
            if(!input) {
                if(!silent) alert("Please enter a code");
                return;
            }

            try {
                // 1. Check if code exists in DB
                const { data, error } = await sb
                    .from('devices')
                    .select('*')
                    .eq('code', input)
                    .single(); 
                
                if (error || !data) {
                    if(error && error.code === '42501') {
                        alert("Permission Denied: Did you run the SQL policies?");
                    } else if (!silent) {
                        alert("Invalid Code. Please check CMS.");
                    }
                    // Reset if invalid
                    localStorage.removeItem('pair_code');
                    return;
                }

                // 2. Success
                localStorage.setItem('pair_code', input);
                myCode = input;
                startPlayer();

            } catch (e) {
                if(!silent) alert("Connection Error: " + e.message);
            }
        }

        function startPlayer() {
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('player').classList.remove('hidden');
            
            // Poll for updates every 10 seconds
            setInterval(checkUpdates, 10000); 
            checkUpdates();
        }

        async function checkUpdates() {
            document.getElementById('status-bar').innerText = "Checking updates...";

            // 1. SELF-HEALING: Check if device still exists
            const { data: device, error } = await sb
                .from('devices')
                .select('playlist_id')
                .eq('code', myCode)
                .single();

            // If device was deleted in CMS, reset the player
            if (error || !device) {
                alert("Device unlinked from CMS. Resetting...");
                localStorage.removeItem('pair_code');
                location.reload();
                return;
            }

            // 2. Heartbeat (Tell CMS we are online)
            await sb.from('devices')
                .update({ status: 'online', last_seen: new Date() })
                .eq('code', myCode);
            
            if (device.playlist_id) {
                // 3. Get Playlist Items
                const { data: playlist } = await sb
                    .from('playlists')
                    .select('items')
                    .eq('id', device.playlist_id)
                    .single();
                
                if(playlist && playlist.items && playlist.items.length > 0) {
                    const mediaIds = playlist.items.map(i => i.id);
                    
                    // 4. Fetch Media Files
                    const { data: mediaFiles } = await sb
                        .from('media')
                        .select('*')
                        .in('id', mediaIds);
                    
                    // 5. Merge Data
                    const finalPlaylist = playlist.items.map(pItem => {
                        const fileData = mediaFiles.find(f => f.id === pItem.id);
                        if (!fileData) return null;
                        return { 
                            ...fileData, 
                            duration: pItem.duration 
                        }; 
                    }).filter(Boolean); // Remove nulls

                    if(finalPlaylist.length > 0) {
                        smartDownload(finalPlaylist);
                    }
                } else {
                     document.getElementById('status-bar').innerText = "Playlist is empty";
                     document.getElementById('stage').innerHTML = '';
                }
            } else {
                document.getElementById('status-bar').innerText = "No Playlist Assigned";
                document.getElementById('stage').innerHTML = ''; 
            }
        }

        // --- CACHING & PLAYBACK ---
        async function smartDownload(items) {
            document.getElementById('status-bar').innerText = "Downloading content...";
            
            for (let item of items) {
                if (!cache[item.id]) {
                    try {
                        console.log("Downloading", item.name);
                        const response = await fetch(item.url);
                        const blob = await response.blob();
                        cache[item.id] = URL.createObjectURL(blob);
                    } catch (e) {
                        console.error("Failed to cache", item.name);
                    }
                }
            }
            
            if (!window.loopRunning) {
                window.loopRunning = true;
                runLoop(items);
            }
        }

        function runLoop(items) {
            let index = 0;
            const stage = document.getElementById('stage');

            const nextSlide = () => {
                const itemData = items[index];
                const cachedUrl = cache[itemData.id] || itemData.url; 

                // ⚠️ IMPORTANT: These are Backticks (`), not quotes (')
                stage.innerHTML = `<img src="${cachedUrl}" class="slide active">`;
                
                document.getElementById('status-bar').innerText = `Playing: ${itemData.name}`;

                const duration = (itemData.duration || 10) * 1000;

                setTimeout(() => {
                    index = (index + 1) % items.length;
                    nextSlide();
                }, duration);
            };

            nextSlide();
        }
    </script>
</body>
</html>
