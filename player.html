<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpliSign Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: black; cursor: none; overflow: hidden; }
        .pairing-mode { cursor: default; background: #0f172a; }
        .fade-enter { opacity: 0; transition: opacity 1s ease-in-out; }
        .fade-enter-active { opacity: 1; }
    </style>
</head>
<body class="h-screen w-screen">

    <div id="pairing-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center pairing-mode text-white">
        <h1 class="text-xl tracking-widest text-slate-400 mb-8">ENTER PAIRING CODE</h1>
        <input id="pairing-code" type="text" maxlength="6" placeholder="------" 
            class="bg-slate-800 border-2 border-slate-700 text-6xl text-center py-6 w-96 uppercase tracking-[1rem] rounded-xl outline-none focus:border-blue-500 mb-8">
        <button onclick="pairDevice()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-12 rounded-full text-xl transition shadow-lg shadow-blue-900/50">
            CONNECT
        </button>
        <p id="status-msg" class="text-red-500 mt-4 h-6"></p>
    </div>

    <div id="player-canvas" class="absolute inset-0 bg-black hidden">
        <img id="active-slide" class="w-full h-full object-contain absolute inset-0 fade-enter">
        <div id="status-pill" class="absolute bottom-4 right-4 bg-black/50 backdrop-blur text-white/50 text-xs px-3 py-1 rounded-full font-mono z-10">Starting...</div>
    </div>

    <script>
        // --- CONFIGURATION ---
         const SUPABASE_URL = 'https://kbmnkxfosrowmqedykur.supabase.co '; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtibW5reGZvc3Jvd21xZWR5a3VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgyMTIxNTEsImV4cCI6MjA4Mzc4ODE1MX0.l9av5SrgoknXOJZwbmRjLXcB9SYuelivUA4GSv9gsl4';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let deviceCode = localStorage.getItem('ss_device_code');
        let deviceId = null;
        let currentPlaylist = [];
        let currentIndex = 0;
        let imageCache = {};
        let isPlaying = false;

        // --- INIT ---
        if (deviceCode) {
            document.getElementById('pairing-code').value = deviceCode;
            pairDevice(true);
        }

        async function pairDevice(silent = false) {
            const code = document.getElementById('pairing-code').value.toUpperCase();
            if(!silent) document.querySelector('button').innerText = 'CONNECTING...';

            const { data, error } = await sb.from('devices').select('id, code').eq('code', code).single();
            
            if (error || !data) {
                if(!silent) {
                    document.getElementById('status-msg').innerText = 'Invalid Code or Network Error';
                    document.querySelector('button').innerText = 'CONNECT';
                }
                return;
            }

            localStorage.setItem('ss_device_code', code);
            deviceCode = code;
            deviceId = data.id;
            
            document.getElementById('pairing-screen').classList.add('hidden');
            document.getElementById('player-canvas').classList.remove('hidden');
            
            checkUpdates();
            setInterval(checkUpdates, 15000); // Check every 15s
        }

        async function checkUpdates() {
            updateStatus('Checking...');
            
            // 1. Heartbeat
            await sb.from('devices').update({ status: 'online', last_seen: new Date() }).eq('code', deviceCode);

            // 2. Fetch Device & Default Playlist
            const { data: device } = await sb.from('devices').select('playlist_id').eq('id', deviceId).single();
            if(!device) return reloadApp(); // Device deleted

            // 3. CHECK SCHEDULES (Priority)
            const now = new Date();
            const currentTime = now.toTimeString().slice(0,5); // "14:30"
            
            const { data: schedules } = await sb.from('schedules')
                .select('*')
                .eq('device_id', deviceId);

            let activePlaylistId = device.playlist_id; // Default

            // If a schedule matches NOW, override default
            if(schedules && schedules.length > 0) {
                const activeSchedule = schedules.find(s => currentTime >= s.start_time && currentTime <= s.end_time);
                if(activeSchedule) {
                    activePlaylistId = activeSchedule.playlist_id;
                    updateStatus(`Scheduled: ${s.start_time}-${s.end_time}`);
                }
            }

            if (!activePlaylistId) {
                stopPlayback();
                updateStatus('No Content');
                return;
            }

            // 4. Load Playlist Items
            const { data: playlist } = await sb.from('playlists').select('items').eq('id', activePlaylistId).single();
            
            if (!playlist || !playlist.items || !playlist.items.length) {
                stopPlayback(); 
                return;
            }

            // 5. Sync Content
            const ids = playlist.items.map(i => i.id);
            const { data: mediaFiles } = await sb.from('media').select('id, url').in('id', ids);
            
            const newQueue = playlist.items.map(pItem => {
                const file = mediaFiles.find(f => f.id === pItem.id);
                return file ? { ...file, duration: pItem.duration } : null;
            }).filter(Boolean);

            if (JSON.stringify(newQueue) !== JSON.stringify(currentPlaylist)) {
                currentPlaylist = newQueue;
                currentIndex = 0;
                preloadImages(currentPlaylist);
                if (!isPlaying) runLoop();
            }
        }

        function updateStatus(msg) { document.getElementById('status-pill').innerText = msg; }
        
        function stopPlayback() {
            currentPlaylist = []; isPlaying = false;
            document.getElementById('active-slide').src = '';
        }

        function preloadImages(queue) {
            queue.forEach(item => {
                if (!imageCache[item.url]) {
                    const img = new Image();
                    img.src = item.url;
                    imageCache[item.url] = img;
                }
            });
        }

        function runLoop() {
            if (currentPlaylist.length === 0) return;
            isPlaying = true;
            
            const item = currentPlaylist[currentIndex];
            const slide = document.getElementById('active-slide');
            
            slide.classList.remove('fade-enter-active');
            
            setTimeout(() => {
                slide.src = item.url;
                slide.classList.add('fade-enter-active');
                
                const nextDuration = (item.duration || 10) * 1000;
                currentIndex = (currentIndex + 1) % currentPlaylist.length;
                setTimeout(runLoop, nextDuration);
            }, 500);
        }

        function reloadApp() { localStorage.removeItem('ss_device_code'); location.reload(); }
    </script>
</body>
</html>
