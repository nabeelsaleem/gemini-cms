<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Player</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: black; color: white; overflow: hidden; font-family: sans-serif; }
        .hidden { display: none !important; }
        
        /* Pairing Screen */
        #setup { height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; background: #111; }
        input { font-size: 3rem; text-align: center; width: 300px; padding: 15px; margin: 20px 0; text-transform: uppercase; letter-spacing: 10px; background: #222; border: 2px solid #444; color: white; border-radius: 10px; }
        button { padding: 15px 40px; font-size: 1.5rem; cursor: pointer; background: #2563eb; color: white; border: none; border-radius: 50px; font-weight: bold; }
        button:hover { background: #1d4ed8; }

        /* Player Screen */
        #player { position: relative; width: 100vw; height: 100vh; }
        .slide { position: absolute; top:0; left:0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 1s; background: black; }
        .active { opacity: 1; }
        
        #status-bar { position: fixed; bottom: 10px; right: 10px; color: rgba(255,255,255,0.5); font-size: 0.8rem; z-index: 100; }
    </style>
</head>
<body>

    <div id="setup">
        <div>
            <h1 style="color:#888; margin-bottom:0">ENTER PAIRING CODE</h1>
            <input id="code" maxlength="6" placeholder="------">
            <br>
            <button onclick="pair()">CONNECT</button>
        </div>
    </div>

    <div id="player" class="hidden">
        <div id="stage"></div>
        <div id="status-bar">Waiting for content...</div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // ⚠️ PASTE YOUR KEYS HERE AGAIN (Same as CMS) ⚠️
        const YOUR_SUPABASE_URL = 'https://kbmnkxfosrowmqedykur.supabase.co'; 
        const YOUR_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtibW5reGZvc3Jvd21xZWR5a3VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgyMTIxNTEsImV4cCI6MjA4Mzc4ODE1MX0.l9av5SrgoknXOJZwbmRjLXcB9SYuelivUA4GSv9gsl4';

        const sb = supabase.createClient(YOUR_SUPABASE_URL, YOUR_SUPABASE_KEY);

        let myCode = localStorage.getItem('pair_code');
        let cache = {}; 

        // Auto-start if paired before
        if (myCode) {
            document.getElementById('code').value = myCode;
            pair(true); // true = silent mode (no alerts)
        }

        async function pair(silent = false) {
            const input = document.getElementById('code').value.toUpperCase();
            
            if(!input) {
                if(!silent) alert("Please enter a code");
                return;
            }

            try {
                // 1. Check if code exists in DB
                const { data, error } = await sb
                    .from('devices')
                    .select('*')
                    .eq('code', input)
                    .single(); // .single() returns error if no row found
                
                if (error || !data) {
                    // Check specifically if it's a permissions issue
                    if(error && error.code === '42501') {
                        alert("Permission Denied: Did you run the SQL policies in Step 1?");
                    } else if (!silent) {
                        alert("Invalid Code. Please check CMS.");
                    }
                    localStorage.removeItem('pair_code');
                    return;
                }

                // 2. Success
                localStorage.setItem('pair_code', input);
                myCode = input;
                startPlayer();

            } catch (e) {
                alert("Connection Error: " + e.message);
            }
        }

        function startPlayer() {
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('player').classList.remove('hidden');
            
            // Poll for updates every 10 seconds
            setInterval(checkUpdates, 10000); 
            checkUpdates();
        }

        async function checkUpdates() {
            document.getElementById('status-bar').innerText = "Checking updates...";

            // 1. Heartbeat (Tell CMS we are online)
            await sb.from('devices')
                .update({ status: 'online', last_seen: new Date() })
                .eq('code', myCode);

            // 2. Get Device Info (To find assigned playlist)
            const { data: device } = await sb
                .from('devices')
                .select('playlist_id')
                .eq('code', myCode)
                .single();
            
            if (device && device.playlist_id) {
                // 3. Get Playlist Items
                // Note: We perform a "Join" manually here for simplicity
                const { data: playlist } = await sb
                    .from('playlists')
                    .select('items') // items is an array of media IDs
                    .eq('id', device.playlist_id)
                    .single();
                
                if(playlist && playlist.items && playlist.items.length > 0) {
                    // 4. Fetch Media Details
                    const { data: mediaItems } = await sb
                        .from('media')
                        .select('*')
                        .in('id', playlist.items);
                    
                    if(mediaItems) smartDownload(mediaItems);
                } else {
                     document.getElementById('status-bar').innerText = "Playlist is empty";
                }
            } else {
                document.getElementById('status-bar').innerText = "No Playlist Assigned";
                document.getElementById('stage').innerHTML = ''; // Clear screen
            }
        }

        // --- CACHING & PLAYBACK ---
        async function smartDownload(items) {
            document.getElementById('status-bar').innerText = "Downloading content...";
            
            for (let item of items) {
                if (!cache[item.id]) {
                    try {
                        console.log("Downloading", item.name);
                        const response = await fetch(item.url);
                        const blob = await response.blob();
                        cache[item.id] = URL.createObjectURL(blob);
                    } catch (e) {
                        console.error("Failed to cache", item.name);
                    }
                }
            }
            
            // Start Loop if not running
            if (!window.loopRunning) {
                window.loopRunning = true;
                runLoop(items);
            }
        }

        function runLoop(items) {
            let index = 0;
            const stage = document.getElementById('stage');

            const nextSlide = () => {
                const item = items[index];
                const cachedUrl = cache[item.id] || item.url; 

                // Display Image
                stage.innerHTML = `<img src="${cachedUrl}" class="slide active">`;
                document.getElementById('status-bar').innerText = `Playing: ${item.name}`;

                // Wait duration then next
                setTimeout(() => {
                    index = (index + 1) % items.length;
                    nextSlide();
                }, item.duration || 5000);
            };

            nextSlide();
        }
    </script>
</body>
</html>
