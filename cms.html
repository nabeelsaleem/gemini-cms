<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Dashboard | SimpliSign</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; }
        .hidden { display: none !important; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        
        /* Auth */
        #auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; }
        .auth-card { background: white; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; }
        .google-btn { width: 100%; padding: 12px; background: #fff; color: #333; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 500; margin-bottom: 20px; transition: 0.2s; }
        .google-btn:hover { background: #f8f9fa; border-color: #ccc; }
        .divider { display: flex; align-items: center; color: #666; font-size: 0.8rem; margin: 20px 0; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #eee; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn-primary { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        
        /* Dashboard */
        nav { background: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .btn-nav { padding: 8px 16px; border: none; background: none; cursor: pointer; color: #64748b; font-weight: 500; }
        .btn-nav.active { color: var(--primary); background: #eff6ff; border-radius: 4px; }
        
        /* Components */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: white; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .media-preview { height: 120px; background: #f1f5f9; border-radius: 4px; margin-bottom: 10px; object-fit: cover; width: 100%; }
        .badge { background: #dcfce7; color: #166534; padding: 4px 8px; border-radius: 99px; font-size: 0.75rem; font-weight: 600; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <h2 style="margin-top:0">Welcome Back</h2>
            <p style="color:#64748b; margin-bottom:30px">Login to manage your screens</p>
            
            <button class="google-btn" onclick="loginGoogle()">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20">
                Sign in with Google
            </button>

            <div class="divider">OR CONTINUE WITH EMAIL</div>

            <input type="email" id="email" placeholder="name@company.com">
            <input type="password" id="password" placeholder="Password">
            <button class="btn-primary" onclick="handleEmailAuth()" id="auth-action-btn">Login</button>
            
            <p style="font-size:0.9rem; margin-top:20px; color:#64748b; cursor:pointer" onclick="toggleAuth()" id="auth-toggle">
                Don't have an account? <span style="color:var(--primary)">Sign up</span>
            </p>
            <p id="error-msg" style="color:red; font-size:0.9rem; display:none"></p>
        </div>
    </div>

    <div id="dashboard" class="hidden">
        <nav>
            <div style="font-weight:bold; font-size:1.2rem;">📺 SimpliSign</div>
            <div id="nav-menu">
                <button class="btn-nav active" onclick="showTab('media')">Media</button>
                <button class="btn-nav" onclick="showTab('devices')">Screens</button>
            </div>
            <div style="display:flex; gap:10px; align-items:center">
                <span id="plan-badge" class="badge">FREE PLAN</span>
                <button class="btn-nav" style="color:#ef4444" onclick="logout()">Logout</button>
            </div>
        </nav>

        <div class="container">
            <div id="tab-media">
                <div style="display:flex; justify-content:space-between; align-items:center">
                    <h3>Media Library</h3>
                    <div>
                        <input type="file" id="file-upload" style="display:none" onchange="uploadMedia()">
                        <button class="btn-primary" style="width:auto" onclick="document.getElementById('file-upload').click()">+ Upload Media</button>
                    </div>
                </div>
                <div id="media-list" class="grid"></div>
            </div>

            <div id="tab-devices" class="hidden">
                <div style="display:flex; justify-content:space-between; align-items:center">
                    <h3>Connected Screens</h3>
                    <button class="btn-primary" style="width:auto" onclick="addDevice()">+ New Screen</button>
                </div>
                <div id="device-list" class="grid"></div>
            </div>
        </div>
    </div>

    <script>
        // --- SETUP ---
        const SUPABASE_URL = 'https://kbmnkxfosrowmqedykur.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtibW5reGZvc3Jvd21xZWR5a3VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgyMTIxNTEsImV4cCI6MjA4Mzc4ODE1MX0.l9av5SrgoknXOJZwbmRjLXcB9SYuelivUA4GSv9gsl4';
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let isSignUp = false;

        // --- AUTHENTICATION ---
        
        // 1. Google Login (Now works on GitHub Pages!)
        async function loginGoogle() {
            const { data, error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    // This ensures users come back to THIS page after Google
                    redirectTo: window.location.href 
                }
            });
            if (error) alert(error.message);
        }

        // 2. Email Login/Signup
        async function handleEmailAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) return alert("Please fill all fields");

            let result;
            if(isSignUp) {
                result = await supabase.auth.signUp({ email, password });
                if(!result.error && !result.data.session) alert("Check email for confirmation link!");
            } else {
                result = await supabase.auth.signInWithPassword({ email, password });
            }

            if(result.error) {
                document.getElementById('error-msg').innerText = result.error.message;
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        // 3. Toggle Mode
        function toggleAuth() {
            isSignUp = !isSignUp;
            document.getElementById('auth-action-btn').innerText = isSignUp ? 'Create Account' : 'Login';
            document.getElementById('auth-toggle').innerHTML = isSignUp 
                ? 'Already have an account? <span style="color:var(--primary)">Login</span>' 
                : 'Don\'t have an account? <span style="color:var(--primary)">Sign up</span>';
        }

        // 4. Session Listener (Handles redirects from Google)
        supabase.auth.onAuthStateChange((event, session) => {
            if (session) {
                currentUser = session.user;
                initDashboard();
            }
        });

        async function logout() {
            await supabase.auth.signOut();
            location.reload();
        }

        // --- DASHBOARD LOGIC ---
        function initDashboard() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            loadMedia();
            loadDevices();
            checkPlan();
        }

        async function checkPlan() {
            const { data: profile } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
            const { count } = await supabase.from('devices').select('*', { count: 'exact', head: true }).eq('user_id', currentUser.id);
            
            const limit = profile ? profile.screen_limit : 3;
            document.getElementById('plan-badge').innerText = `${count} / ${limit} SCREENS`;
            window.userLimit = limit;
            window.userCount = count;
        }

        async function loadMedia() {
            const { data } = await supabase.from('media').select('*');
            document.getElementById('media-list').innerHTML = data.map(m => `
                <div class="card">
                    <img src="${m.url}" class="media-preview">
                    <div style="font-weight:500">${m.name}</div>
                </div>
            `).join('');
        }

        async function uploadMedia() {
            const file = document.getElementById('file-upload').files[0];
            if (!file) return;
            
            const fileName = `${Date.now()}-${file.name.replace(/\s/g, '')}`;
            // Upload to Bucket
            const { error: uploadError } = await supabase.storage.from('media').upload(fileName, file);
            if(uploadError) return alert(uploadError.message);

            // Get URL
            const { data: { publicUrl } } = supabase.storage.from('media').getPublicUrl(fileName);

            // Save to DB
            await supabase.from('media').insert({
                user_id: currentUser.id,
                name: file.name,
                type: 'image',
                url: publicUrl
            });
            loadMedia();
        }

        function showTab(tab) {
            document.getElementById('tab-media').classList.add('hidden');
            document.getElementById('tab-devices').classList.add('hidden');
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            
            document.querySelectorAll('.btn-nav').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        async function addDevice() {
            if(window.userCount >= window.userLimit) return alert("Upgrade to add more screens!");
            
            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            await supabase.from('devices').insert({
                user_id: currentUser.id,
                code: code,
                name: 'New Screen',
                status: 'offline'
            });
            loadDevices();
            checkPlan();
            alert(`New Screen Code: ${code}`);
        }

        async function loadDevices() {
            const { data } = await supabase.from('devices').select('*');
            document.getElementById('device-list').innerHTML = data.map(d => `
                <div class="card">
                    <h3>${d.name}</h3>
                    <div style="font-size:1.5rem; letter-spacing:2px; margin:10px 0; font-weight:bold">${d.code}</div>
                    <div class="badge" style="background:${d.status==='online'?'#dcfce7':'#fee2e2'}; color:${d.status==='online'?'#166534':'#991b1b'}">
                        ${d.status.toUpperCase()}
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
